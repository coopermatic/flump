name: Flump macOS

on:
  push:
    branches: [codex/native-air-build]
    paths: ['.github/**', 'bin/**', 'exporter/**']
  workflow_dispatch:
    inputs:
      signed:
        description: Build signed distribution candidates (requires configured environment)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flump-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flump
      - name: Compile unchanged application and tests
        run: ant -f exporter/build.xml check-air verify-libs swf test-swf
      - name: Native ARM64 export comparison
        run: python3 bin/ci-macos-smoke.py
      - name: Existing integration suite (diagnostic, includes known loop-label failures)
        id: integration
        continue-on-error: true
        run: |
          set -o pipefail
          ant -f exporter/build.xml test 2>&1 | tee exporter/build/ci/integration.txt
      - name: Record test status without hiding failures
        if: always()
        env:
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
        run: |
          echo "Integration suite: $INTEGRATION_OUTCOME. See integration.txt; the Windows baseline has 13 passes and 3 loop-label failures." >> "$GITHUB_STEP_SUMMARY"
          echo "This job produces developer evidence, not an installable Mac package." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$INTEGRATION_OUTCOME" == failure ]]; then
            echo '::warning::Integration suite failed. This is not a clean full regression pass.'
          fi
      - name: Save developer evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-build-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            exporter/build/ci/
            exporter/build/flump-exporter.swf
            exporter/build/flump-test.swf

  distribution:
    needs: validate
    # Push allows an initial branch-only run before workflow_dispatch exists on master.
    # Enable this repository variable only after configuring the protected environment.
    if: vars.FLUMP_MAC_SIGNING_READY == 'true' && (github.event_name == 'push' || inputs.signed)
    environment: macos-distribution
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check required setup before downloading tools
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          AIR_LICENSE_CONFIRMED: ${{ vars.AIR_LICENSE_CONFIRMED }}
        run: python3 bin/ci-package-macos.py --preflight
      - uses: ./.github/actions/setup-flump
        with:
          air-license-base64: ${{ secrets.AIR_SDK_LICENSE_BASE64 }}
      - run: ant -f exporter/build.xml check-air verify-libs swf
      - name: Sign, test and notarise standalone application
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          AIR_LICENSE_CONFIRMED: ${{ vars.AIR_LICENSE_CONFIRMED }}
        run: python3 bin/ci-package-macos.py app
      - name: Save notarised standalone ZIP for owner review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flump-mac-universal-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: exporter/build/distribution/*
      - name: Build preferred shared-runtime air4mac candidate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          AIR_LICENSE_CONFIRMED: ${{ vars.AIR_LICENSE_CONFIRMED }}
          AIR_SIGNING_P12_BASE64: ${{ secrets.AIR_SIGNING_P12_BASE64 }}
          AIR_SIGNING_P12_PASSWORD: ${{ secrets.AIR_SIGNING_P12_PASSWORD }}
          AIR_TIMESTAMP_URL: ${{ vars.AIR_TIMESTAMP_URL }}
        run: python3 bin/ci-package-macos.py air4mac
      - name: Save air4mac validation candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flump-air4mac-validation-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: exporter/build/air4mac-validation/*
      - name: Save packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-packaging-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: exporter/build/ci/
